name: Sync upstream integration into maplibre-map-slice1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maplibre-map-slice1
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream/integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LiteFarmOrg/LiteFarm.git
          git fetch upstream integration

          if git merge-base --is-ancestor upstream/integration HEAD; then
            echo "Already up to date"
            exit 0
          fi

          if ! git merge --no-edit upstream/integration; then
            git merge --abort
            echo "::error::Merge conflict with upstream/integration - resolve locally"
            exit 1
          fi

          git push origin HEAD:maplibre-map-slice1
